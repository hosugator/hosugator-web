      - heading "adr-frontmatter-layering" [level=1] [ref=f37e242]
      - generic [ref=f37e243]:
        - heading "Context" [level=2] [ref=f37e244]
        - paragraph [ref=f37e245]:
          - text: "[[pkm-역할-재정의]]에서 \"MOC와 태그가 유일한 탐색 구조\"로 결정했으나, frontmatter의"
          - code [ref=f37e246]: subject
          - text: 필드 역할이 모호했다. 초기 설계는
          - code [ref=f37e247]: "subject: \"[[MOC - AI]]\""
          - text: 형태로 Dataview가 해당 필드를 쿼리해 MOC를 자동 구성하는 top-down 방식이었다. 이는 사실상 폴더 시스템과 동일한 구조이며 Zettelkasten의 bottom-up 원칙과 충돌한다는 것이 명확해졌다. 동시에 subject 필드를 완전히 제거하면 "제목은 모르지만 주제는 아는" 상황에서의 탐색 수단을 잃는다. Obsidian + Dataview 조합에서 frontmatter 기반 필터링은 실용적 가치가 있다.
        - heading "Decision" [level=2] [ref=f37e248]
        - paragraph [ref=f37e249]:
          - strong [ref=f37e250]: frontmatter와 본문 링크를 두 개의 독립 레이어로 분리한다.
        - table [ref=f37e251]:
          - rowgroup [ref=f37e252]:
            - row "레이어 도구 인지 모드 역할" [ref=f37e253]:
              - columnheader "레이어" [ref=f37e254]
              - columnheader "도구" [ref=f37e255]
              - columnheader "인지 모드" [ref=f37e256]
              - columnheader "역할" [ref=f37e257]
          - rowgroup [ref=f37e258]:
            - row "Obsidian 탐색 레이어 subject, project, tags 검색/필터 \"AI 관련 노트 뭐가 있지?\"" [ref=f37e259]:
              - cell "Obsidian 탐색 레이어" [ref=f37e260]
              - cell "subject, project, tags" [ref=f37e261]
              - cell "검색/필터" [ref=f37e262]
              - cell "\"AI 관련 노트 뭐가 있지?\"" [ref=f37e263]
            - row "Zettelkasten 지식 그래프 본문 백링크, 그래프 뷰 사고/발견 \"이 개념이 무엇과 연결되는가?\"" [ref=f37e264]:
              - cell "Zettelkasten 지식 그래프" [ref=f37e265]
              - cell "본문 백링크, 그래프 뷰" [ref=f37e266]
              - cell "사고/발견" [ref=f37e267]
              - cell "\"이 개념이 무엇과 연결되는가?\"" [ref=f37e268]
        - paragraph [ref=f37e269]:
          - strong [ref=f37e270]: "구체적 결정:"
        - list [ref=f37e271]:
          - listitem [ref=f37e272]:
            - code [ref=f37e273]: subject
            - text: = 도메인 필터 레이블. MOC 소속 선언이 아니다. Dataview 쿼리용 메타데이터.
          - listitem [ref=f37e274]:
            - code [ref=f37e275]: project
            - text: = 출처 추적(provenance). "이 노트가 어느 맥락에서 생겼는가". 유지.
          - listitem [ref=f37e276]:
            - code [ref=f37e277]: tags
            - text: = 다차원 분류. subject 단일값의 한계를 보완.
          - listitem [ref=f37e278]:
            - strong [ref=f37e279]: 본문 링크가 실제 Zettelkasten 구조의 1차 수단
            - text: 이다. frontmatter는 탐색 편의 레이어.
          - listitem [ref=f37e280]:
            - text: 그래프 뷰는 per-note 습관이 아니라
            - strong [ref=f37e281]: 주기적 vault review
            - text: 시 활용.
          - listitem [ref=f37e282]: 노트 작성 시 핵심 습관 = 관련 노트 1-2개 본문에 백링크 추가.
        - heading "Consequences" [level=2] [ref=f37e283]
        - list [ref=f37e284]:
          - listitem [ref=f37e285]: frontmatter의 역할이 축소되지만 제거하지 않는다. 두 레이어는 충돌하지 않고 다른 목적을 수행한다.
          - listitem [ref=f37e286]:
            - text: MOC는 Dataview top-down 구성 대신
            - strong [ref=f37e287]: 본문 링크가 모이는 곳에 자연 발생
            - text: 하는 방식으로 전환.
          - listitem [ref=f37e288]: Obsidian 그래프 뷰의 연결망이 실질적인 지식 지형도가 됨 → 백링크 밀도가 PKM 품질 지표.
          - listitem [ref=f37e289]:
            - code [ref=f37e290]: Attention 개념 정리.md
            - text: 처럼 기존 방대한 노트를 원자화하고 MOC로 전환하는 작업이 이 결정의 실천 사례.
        - heading "Succeeding" [level=2] [ref=f37e291]
        - list [ref=f37e292]:
          - listitem [ref=f37e293]: "[[pkm-역할-재정의]] — PKM 역할 재정의 (상위 ADR)"
